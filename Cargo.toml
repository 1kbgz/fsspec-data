[package]
name = "fsspec_data_py"
version = "0.9.0"
edition = "2021"
publish = false

[lib]
name = "fsspec_data"
path = "rust/python/lib.rs"
crate-type = ["cdylib"]

[dependencies]
fsspec_data = { path = "./rust", version = "*" }
arrow = { version = "60.1.0", features = ["pyarrow"] }
fsspec_rs = "0.4.0"
futures = { version = "0.3", default-features = false, features = ["std"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["sync"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pyo3 = { version = "0.29", features = ["abi3", "extension-module"] }

[profile.release]
panic = "abort"
lto = true

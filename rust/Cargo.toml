[package]
name = "fsspec_data"
version = "0.8.0"
authors = ["the fsspec-data authors <dev@1kbgz.com>"]
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/1kbgz/fsspec-data"
description = "Arrow interchange planning for the fsspec ecosystem"

[lib]
name = "fsspec_data"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
arrow = "60.1.0"
arrow-avro = { version = "60.1.0", default-features = false, features = ["deflate", "snappy", "zstd"] }
bytes = "1"
fsspec_rs = { git = "https://github.com/1kbgz/fsspec-rs", rev = "637eda9d6a6277b9e157c96a13da58036faf3f3a" }
futures = { version = "0.3", default-features = false, features = ["std"] }
parquet = { version = "60.1.0", features = ["arrow", "async"] }
serde = "1"
serde_json = "1"
thiserror = "2"
ureq = { version = "3", optional = true }

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }

[features]
confluent = ["dep:ureq"]

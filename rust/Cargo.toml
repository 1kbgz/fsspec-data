[package]
name = "fsspec_data"
version = "0.9.0"
authors = ["the fsspec-data authors <dev@1kbgz.com>"]
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/1kbgz/fsspec-data"
description = "Arrow interchange planning for the fsspec ecosystem"

[lib]
name = "fsspec_data"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
arrow = "60.1.0"
arrow-schema = { version = "60.1.0", features = ["serde"] }
arrow-avro = { version = "60.1.0", default-features = false, features = ["deflate", "snappy", "zstd"] }
bytes = "1"
fsspec_rs = "0.4.0"
futures = { version = "0.3", default-features = false, features = ["std", "executor", "async-await"] }
futures-timer = "3"
parquet = { version = "60.1.0", features = ["arrow", "async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
ureq = { version = "3", optional = true }
uuid = { version = "1", features = ["v4"] }

[features]
confluent = ["dep:ureq"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

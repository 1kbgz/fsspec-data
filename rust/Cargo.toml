[package]
name = "fsspec_data"
version = "0.4.0"
authors = ["the fsspec-data authors <dev@1kbgz.com>"]
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/1kbgz/fsspec-data"
description = "Arrow interchange planning for the fsspec ecosystem"

[lib]
name = "fsspec_data"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
arrow = "60.1.0"
arrow-avro = { version = "60.1.0", default-features = false, features = ["deflate", "snappy", "zstd"] }
bytes = "1"
fsspec_rs = "0.1.7"
parquet = { version = "60.1.0", features = ["arrow"] }
serde = "1"
serde_json = "1"
thiserror = "2"
ureq = { version = "3", optional = true }

[features]
confluent = ["dep:ureq"]
